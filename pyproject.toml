[project]
name = "avsim-scene-encoder"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["torch>=2.4", "numpy>=2.0", "pandas>=2.2"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
